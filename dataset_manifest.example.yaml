# dataset_manifest.example.yaml
#
# Copy this file to dataset_manifest.yaml (or any name — point
# onboard_dataset.py's MANIFEST_FILE at it) and fill in the "source" paths
# with wherever your raw files actually live and however they're actually
# named. onboard_dataset.py reads this once per grain and stages copies
# (or, for the big XRF h5, a symlink) into this project's exact naming
# conventions — it never renames/moves your originals.
#
# Every section below is optional — omit any you don't have data for.

grain_id: "EXAMPLE-01"   # drives every destination filename below

# --- CL image ----------------------------------------------------------
# cl_filename in CL_EPMA_registration.m is a free parameter (any name/
# format cpselect can read), so this section is just a predictable staging
# location, not a hard requirement.
cl_image:
  source: "/path/to/raw/cl_photo_whatever_they_called_it.tif"
  dest: null   # default: <project_root>/<grain_id>_CL_raw<ext>

# --- EPMA / XRF element maps --------------------------------------------
# Required destination convention (auto-discovered by CL_EPMA_registration.m
# / CL_region_extraction.m as epma_dir): maps/<grain_id>/<grain_id>_<Element>_<Line>.tif
epma_maps:
  source_dir: "/path/to/raw/element_maps"
  output_dir: null       # default: maps/<grain_id>
  include: "*.tif*"      # glob for which files in source_dir to consider

  # Option A — explicit per-file mapping (highest priority, exact control):
  files:
    "img_003.tif": "Fe_Ka"
    "img_004.tif": "Cr_Ka"

  # Option B — regex auto-detect across many files at once. Must define
  # named groups (?P<element>...) and (?P<line>...), and must match the
  # WHOLE filename (re.fullmatch) — a file that doesn't match end-to-end
  # is skipped with a warning rather than partially/incorrectly parsed.
  # Files already covered by an entry in `files` above are skipped here.
  filename_pattern: null   # e.g. '(?P<element>[A-Za-z]+)[_-](?P<line>[A-Za-z]+)\.tif'

  # Alias tables applied to whatever filename_pattern captures, e.g. if your
  # files say "Iron_Kalpha" instead of "Fe_Ka":
  element_alias:
    Iron: Fe
    Titanium: Ti
  line_alias:
    Kalpha: Ka
    Lalpha: La

# --- XANES pre-edge classification CSV ----------------------------------
xanes_classification:
  source: "/path/to/raw/my_classification_results.csv"
  dest: null   # default: xanes_classification/<grain_id>_pre_edge_classification.csv

# --- Raw XRF HDF5 --------------------------------------------------------
# H5_FILE/GRAIN_ID in xrf_h5_to_tiff.py and xrf_h5_extract_spots.py are set
# by hand each run, so relocating the h5 itself is only a convenience.
# What actually matters for xrf_h5_extract_spots.py is whether your
# xrmmap/areas spot names contain a recognizable "spot<N>" pattern —
# suggest_name_filter checks that and reports what to change if not.
xrf_h5:
  source: "/path/to/raw/whatever_they_named_the_scan.h5"
  stage: true                  # symlink (not copy — these are multi-GB) to dest
  dest: null                   # default: <project_root>/<grain_id>_xrf.h5
  suggest_name_filter: true    # analyze xrmmap/areas naming, print recommendations
